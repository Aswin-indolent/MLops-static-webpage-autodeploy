version: 0.0
os: linux

files:
  - source: /
    destination: /opt/ml-cicd-demo

file_exists_behavior: OVERWRITE

hooks:
  

  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 120
      runas: root
