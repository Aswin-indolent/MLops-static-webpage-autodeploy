<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris ML Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .success {
            background: #ecfdf5;
            color: #065f46;
        }

        .error {
            background: #fef2f2;
            color: #991b1b;
        }

        .flower {
            font-size: 25px;
            font-weight: bold;
            margin-top: 8px;
        }

        .loading {
            background: #eff6ff;
            color: #1e40af;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌸 Iris ML Predictor</h1>

    <p class="subtitle">
        Enter the flower measurements and let the Machine Learning model predict the species.
    </p>

    <div class="grid">

        <div>
            <label for="sepal_length">Sepal Length (cm)</label>
            <input type="number" id="sepal_length" step="0.1" placeholder="5.1">
        </div>

        <div>
            <label for="sepal_width">Sepal Width (cm)</label>
            <input type="number" id="sepal_width" step="0.1" placeholder="3.5">
        </div>

        <div>
            <label for="petal_length">Petal Length (cm)</label>
            <input type="number" id="petal_length" step="0.1" placeholder="1.4">
        </div>

        <div>
            <label for="petal_width">Petal Width (cm)</label>
            <input type="number" id="petal_width" step="0.1" placeholder="0.2">
        </div>

    </div>

    <button onclick="predictIris()">
        Predict Flower
    </button>

    <div id="result"></div>

</div>

<script>
async function predictIris() {

    const result = document.getElementById("result");

    const data = {
        sepal_length: parseFloat(document.getElementById("sepal_length").value),
        sepal_width: parseFloat(document.getElementById("sepal_width").value),
        petal_length: parseFloat(document.getElementById("petal_length").value),
        petal_width: parseFloat(document.getElementById("petal_width").value)
    };

    if (Object.values(data).some(value => isNaN(value))) {
        result.style.display = "block";
        result.className = "error";
        result.innerHTML = "Please enter all four measurements.";
        return;
    }

    result.style.display = "block";
    result.className = "loading";
    result.innerHTML = "Running ML prediction...";

    try {

        const response = await fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const output = await response.json();

        if (!response.ok) {
            throw new Error(output.error || "Prediction failed");
        }

        result.className = "success";

        result.innerHTML = `
            <div>Prediction from Random Forest ML Model</div>
            <div class="flower">${output.prediction}</div>
            <div>Class ID: ${output.class_id}</div>
        `;

    } catch (error) {

        result.style.display = "block";
        result.className = "error";
        result.innerHTML = "Error: " + error.message;

    }
}
</script>

</body>
</html>
